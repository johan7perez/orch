[package]
name = "orch-postgres"
description = "Conector PostgreSQL de Orch: lectura por cursor y escritura con COPY BINARY."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orch-core.workspace = true

arrow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
native-tls.workspace = true
postgres-native-tls.workspace = true
postgres-types.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
orch-connectors.workspace = true
# Para comparar el `filter` de DataFusion con el mismo filtro empujado al
# servidor: sin él, el pipeline «sin empujar» no se podría ni construir.
orch-sql.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
