[package]
name = "orch-app"
description = "Aplicación de escritorio de Orch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "orch-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
orch-core.workspace = true
orch-connectors.workspace = true
orch-sql.workspace = true
orch-rest.workspace = true
orch-postgres.workspace = true
orch-flight.workspace = true
orch-store.workspace = true
orch-version.workspace = true
orch-schedule.workspace = true
orch-edit.workspace = true
orch-wasm.workspace = true
orch-alert.workspace = true

chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# La notificación en Linux, con el nombre de la aplicación (ver `avisos`). La
# misma versión que ya trae el plugin de notificaciones.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"

[dev-dependencies]
tempfile.workspace = true
