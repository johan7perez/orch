[workspace]
resolver = "2"
members = [
    "crates/orch-core",
    "crates/orch-connectors",
    "crates/orch-sql",
    "crates/orch-rest",
    "crates/orch-postgres",
    "crates/orch-store",
    "crates/orch-schedule",
    "crates/orch-edit",
    "crates/orch-alert",
    "crates/orch-wasm",
    "crates/orch-plugin",
    "plugins/fisgon",
    "plugins/identidad",
    "plugins/mayusculas",
    "crates/orch-cli",
    "crates/orch-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/johanperez/orch"

[workspace.dependencies]
orch-core = { path = "crates/orch-core", version = "0.0.1" }
orch-connectors = { path = "crates/orch-connectors", version = "0.0.1" }
orch-sql = { path = "crates/orch-sql", version = "0.0.1" }
orch-rest = { path = "crates/orch-rest", version = "0.0.1" }
orch-postgres = { path = "crates/orch-postgres", version = "0.0.1" }
orch-store = { path = "crates/orch-store", version = "0.0.1" }
orch-schedule = { path = "crates/orch-schedule", version = "0.0.1" }
orch-edit = { path = "crates/orch-edit", version = "0.0.1" }
orch-alert = { path = "crates/orch-alert", version = "0.0.1" }
orch-wasm = { path = "crates/orch-wasm", version = "0.0.1" }
orch-plugin = { path = "crates/orch-plugin", version = "0.0.1" }

arrow = "59"
# Lo justo de Arrow para un plugin compilado a WASM: sin CSV ni JSON, que
# sólo engordarían el binario que se carga en cada nodo.
arrow-array = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }
arrow-ipc = { version = "59", default-features = false }
async-trait = "0.1"
# DataFusion 55 depende de arrow ^59.2, así que cargo unifica una sola versión
# de Arrow en todo el workspace. Si se sube `arrow`, hay que subir esto a la vez.
datafusion = "55"
futures = "0.3"
# Va emparejado con `arrow`: son el mismo repositorio y la misma versión.
parquet = "59"
# TLS por defecto = schannel en Windows: sin dependencias externas que compilar.
reqwest = { version = "0.13", features = ["json"] }

bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10"
cron = "0.17"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# `bundled` compila DuckDB desde fuente: la primera build es larga, pero el
# binario no depende de que haya una libduckdb instalada en la máquina.
duckdb = { version = "1", features = ["bundled"] }
keyring = "4"
native-tls = "0.2"
postgres-native-tls = "0.5"
postgres-types = "0.2"
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# El esquema de config sale del mismo struct que la parsea: una sola
# definición, imposible que se desincronicen.
schemars = "1"
serde_yaml = "0.9"
# Árbol sintáctico sin pérdidas: el editor del lienzo toca sólo lo que cambia y
# deja comentarios y formato del YAML como estaban.
yaml-edit = { version = "0.3.6", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

tempfile = "3"

# Plugins WASM (Fase 2.5). El modelo de componentes, con la interfaz en WIT:
# el plugin puede escribirse en cualquier lenguaje que compile a un
# componente, y corre aislado, sin más acceso al sistema que el que se le dé.
wasmtime = { version = "50", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "std",
    # Compilar un plugin de 2 MB cuesta ~2 s: la caché lo deja en disco y los
    # arranques siguientes no lo repiten.
    "cache",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wit-bindgen = "0.63"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Perfil para medir throughput real sin perder el stack trace de un panic.
[profile.bench-fast]
inherits = "release"
debug = 1
panic = "unwind"
