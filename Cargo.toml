[workspace]
resolver = "2"
members = ["crates/orch-core", "crates/orch-connectors", "crates/orch-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/johanperez/orch"

[workspace.dependencies]
orch-core = { path = "crates/orch-core", version = "0.0.1" }
orch-connectors = { path = "crates/orch-connectors", version = "0.0.1" }

arrow = "59"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Perfil para medir throughput real sin perder el stack trace de un panic.
[profile.bench-fast]
inherits = "release"
debug = 1
panic = "unwind"
